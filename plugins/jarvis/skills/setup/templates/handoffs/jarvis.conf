# Settings for handoffs/bin/jarvis. Plain shell assignments; jarvis sources this file.

# Claude sessions running at once, Jarvis included. `jarvis spawn` refuses a Claude
# worker past this; Codex and OpenCode workers don't count. 3 = Jarvis + 2 workers.
JARVIS_MAX_CLAUDE={{MAX_CLAUDE}}

# Usage band thresholds, as % of the 5-hour window. The band also turns amber when
# the burn rate is on pace to use the whole window before it resets.
JARVIS_AMBER={{AMBER}}
JARVIS_RED={{RED}}

# After this many idle minutes Jarvis's prompt cache has (nearly) expired, so a big
# context costs more to reload than to rebuild from OPEN.md. `jarvis watch` clears
# Jarvis before waking it; the prompt guard stops the user's first message once.
JARVIS_IDLE_MIN=55
JARVIS_GUARD_TOKENS=100000   # the guard stays quiet below this much context

JARVIS_WATCH_SEC=60          # how often `jarvis watch` looks for handoffs
JARVIS_STALL_MIN=15          # a worker screen unchanged this long, with no handoff, wakes Jarvis
JARVIS_PUSH=1                # `jarvis merge` pushes after committing (0 = don't)

# After closing a worker's terminal, `jarvis merge` stops the processes the worker
# left running: only those naming that worker's own scratch folder, minus what its
# handoff lists under "Processes left running". 0 = list them and stop nothing.
JARVIS_REAP=1

# After closing a worker's terminal, merge and close wait up to this many seconds for
# the terminal to go and the worker's agent to exit. An agent still there is stopped
# (JARVIS_REAP=1: TERM, then KILL after 10 s) or named on the merge line (0).
# `jarvis doctor --apply` stops a finished worker whose terminal is gone even with
# JARVIS_REAP=0: it is an explicit request. Set these here; an exported variable
# doesn't override them.
JARVIS_STOP_GRACE=10

# Fable is off for workers unless you authorize one brief, once, in your own terminal:
# handoffs/bin/jarvis fable allow <brief>. This is how long that stays usable, in minutes.
JARVIS_FABLE_TTL_MIN=120
# Superset can't add --settings to a single launch, so an authorized Fable worker there
# needs an agent config of its own. In Superset, add a Claude agent whose args are
#   --dangerously-skip-permissions --settings {"availableModels":["opus","sonnet","haiku","fable"]}
# then put its id (superset agents list --local --json) here. Spawn uses it only for an
# authorized Fable run; unset, spawn refuses Fable on Superset. Caveat: anything you
# launch from that config by hand can run Fable too. `jarvis spawn` still checks.
# JARVIS_FABLE_SUPERSET_AGENT=<agent config id>

# Where workers run. Empty = detect: Superset in a Superset terminal, Ultron in an Ultron
# session, else tmux when inside tmux. A host of your own goes in handoffs/bin/hosts/<name>.sh.
JARVIS_HOST=

# On tmux, how each agent CLI is launched: claude, codex and opencode are built in
# (same flags as Superset's presets). Add a line for any other agent, then use its
# name as `worker:` in a brief. The line is sh; it reads $JARVIS_MODEL, $JARVIS_EFFORT
# and $JARVIS_PROMPT. Superset and Ultron launch their own agents and ignore these.
# The built-in lines skip permission prompts and Codex's sandbox, as Superset's presets
# do: a worker can run any command as you, unattended. To make workers ask instead,
# override them here, e.g. drop --dangerously-skip-permissions for Claude. Workers will
# then stop at approval prompts and the watcher wakes Jarvis each time.
# JARVIS_AGENT_gemini='gemini --approval-mode=auto_edit ${JARVIS_MODEL:+-m "$JARVIS_MODEL"} "$JARVIS_PROMPT"'

# `jarvis lock <class> -- <command>` runs a heavy command only while it holds a lease for
# its class, shared by every process on this machine (any repo, any agent, you); the
# rest queue in order. Wrap the heavy scripts where they're declared, e.g. in
# package.json: "test:docker": "handoffs/bin/jarvis lock docker -- vitest run --project docker".
# A class is "<scope> <capacity>": host = machine-wide, checkout = this checkout only.
# Built in: docker="host 1" (one Docker suite on the machine), suite="checkout 1".
# A suite that writes shared artifacts in this checkout (build output, a dev database)
# gets a class of its own, even when it's light: two runs at once spoil each other.
# Needs perl. Without it, lock exits 2 and doesn't run the command, except on a CI
# runner (CI set), where it runs the command without the lease and says so.
# The settings below can also come from the environment when they aren't set here.
# JARVIS_LOCK_e2e="host 2"
# JARVIS_LOCK_WAIT=3600        # seconds a waiter queues before giving up (exit 75); --wait overrides
# JARVIS_LOCK_DIR=~/.jarvis/locks  # where the leases live (per user)
# JARVIS_REUSE_MAX_AGE=7200    # --reuse: a pass on the identical tree this recent isn't re-run
#   "identical" counts untracked files: a log written into the checkout (not gitignored)
#   changes the tree and nothing is reused. Write logs outside it or in an ignored folder.
# JARVIS_REUSE_ENV="NODE_ENV"  # --reuse: variables whose values count toward "identical"
