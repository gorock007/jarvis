# Settings for handoffs/bin/jarvis. Plain shell assignments; jarvis sources this file.

# Claude sessions running at once, Jarvis included. `jarvis spawn` refuses a Claude
# worker past this; Codex and OpenCode workers don't count. 3 = Jarvis + 2 workers.
JARVIS_MAX_CLAUDE={{MAX_CLAUDE}}

# Usage band thresholds, as % of the 5-hour window. The band also turns amber when
# the burn rate is on pace to use the whole window before it resets.
JARVIS_AMBER={{AMBER}}
JARVIS_RED={{RED}}

# After this many idle minutes Jarvis's prompt cache has (nearly) expired, so a big
# context costs more to reload than to rebuild from OPEN.md. `jarvis watch` clears
# Jarvis before waking it; the prompt guard stops the user's first message once.
JARVIS_IDLE_MIN=55
JARVIS_GUARD_TOKENS=100000   # the guard stays quiet below this much context

JARVIS_WATCH_SEC=60          # how often `jarvis watch` looks for handoffs
JARVIS_STALL_MIN=15          # a worker screen unchanged this long, with no handoff, wakes Jarvis
JARVIS_PUSH=1                # `jarvis merge` pushes after committing (0 = don't)

# After closing a worker's terminal, `jarvis merge` stops the processes the worker
# left running: only those naming that worker's own scratch folder, minus what its
# handoff lists under "Processes left running". 0 = list them and stop nothing.
JARVIS_REAP=1

# Where workers run. Empty = detect: Superset in a Superset terminal, else tmux when
# inside tmux. A host of your own goes in handoffs/bin/hosts/<name>.sh.
JARVIS_HOST=

# On tmux, how each agent CLI is launched: claude, codex and opencode are built in
# (same flags as Superset's presets). Add a line for any other agent, then use its
# name as `worker:` in a brief. The line is sh; it reads $JARVIS_MODEL, $JARVIS_EFFORT
# and $JARVIS_PROMPT. Superset launches its own presets and ignores these.
# The built-in lines skip permission prompts and Codex's sandbox, as Superset's presets
# do: a worker can run any command as you, unattended. To make workers ask instead,
# override them here, e.g. drop --dangerously-skip-permissions for Claude. Workers will
# then stop at approval prompts and the watcher wakes Jarvis each time.
# JARVIS_AGENT_gemini='gemini --approval-mode=auto_edit ${JARVIS_MODEL:+-m "$JARVIS_MODEL"} "$JARVIS_PROMPT"'
